<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI理财助手</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/ajax/libs/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- Vue Router -->
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    :root {
      --primary: #3B82F6;
      --primary-light: #60A5FA;
      --primary-dark: #2563EB;
      --success: #10B981;
      --danger: #EF4444;
      --warning: #F59E0B;
      --info: #3B82F6;
      --light: #F9FAFB;
      --dark: #1F2937;
      --gray: #6B7280;
      --gray-light: #E5E7EB;
      --gray-dark: #374151;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F9FAFB;
      color: #1F2937;
    }
    
    .transition-all {
      transition-property: all;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      transition-duration: 300ms;
    }
    
    .sidebar {
      width: 250px;
      transition: width 0.3s ease;
    }
    
    .sidebar-collapsed {
      width: 80px;
    }
    
    .sidebar-item {
      transition: all 0.2s ease;
    }
    
    .sidebar-item:hover {
      background-color: rgba(59, 130, 246, 0.1);
    }
    
    .sidebar-item.active {
      background-color: rgba(59, 130, 246, 0.2);
      border-left: 4px solid var(--primary);
    }
    
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    
    .btn-primary {
      background-color: var(--primary);
      color: white;
    }
    
    .btn-primary:hover {
      background-color: var(--primary-dark);
    }
    
    .btn-success {
      background-color: var(--success);
      color: white;
    }
    
    .btn-success:hover {
      background-color: #059669;
    }
    
    .btn-danger {
      background-color: var(--danger);
      color: white;
    }
    
    .btn-danger:hover {
      background-color: #DC2626;
    }
    
    .btn-outline {
      border: 1px solid var(--gray-light);
      color: var(--gray-dark);
    }
    
    .btn-outline:hover {
      background-color: var(--gray-light);
    }
    
    .input-field {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--gray-light);
      border-radius: 8px;
      transition: border-color 0.2s ease;
    }
    
    .input-field:focus {
      outline: none;
      border-color: var(--primary);
    }
    
    .badge {
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    
    .badge-success {
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--success);
    }
    
    .badge-danger {
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--danger);
    }
    
    .badge-warning {
      background-color: rgba(245, 158, 11, 0.1);
      color: var(--warning);
    }
    
    .badge-info {
      background-color: rgba(59, 130, 246, 0.1);
      color: var(--info);
    }
    
    .tab {
      padding: 0.75rem 1rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }
    
    .tab.active {
      border-bottom-color: var(--primary);
      color: var(--primary);
      font-weight: 500;
    }
    
    .chart-container {
      position: relative;
      height: 300px;
      width: 100%;
    }
    
    .progress-bar {
      height: 8px;
      border-radius: 4px;
      background-color: var(--gray-light);
      overflow: hidden;
    }
    
    .progress-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s ease;
    }
    
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
    }
    
    @keyframes skeleton-loading {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }
    
    /* 响应式设计 */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: fixed;
        bottom: 0;
        left: 0;
        z-index: 100;
        display: flex;
        flex-direction: row;
      }
      
      .sidebar-collapsed {
        width: 100%;
      }
      
      .sidebar-menu {
        display: flex;
        flex-direction: row;
        width: 100%;
      }
      
      .sidebar-item {
        flex: 1;
        text-align: center;
        padding: 0.75rem;
      }
      
      .sidebar-item span {
        display: none;
      }
      
      .main-content {
        margin-left: 0;
        margin-bottom: 60px;
      }
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="app" class="flex flex-col md:flex-row min-h-screen">
    <!-- 侧边导航栏 -->
    <aside class="sidebar bg-white shadow-lg h-auto md:h-screen fixed md:sticky top-0 left-0 z-10 transition-all" :class="sidebarCollapsed ? 'sidebar-collapsed' : ''">
      <div class="p-4 flex items-center justify-between">
        <div class="flex items-center">
          <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white">
            <i class="fas fa-chart-pie"></i>
          </div>
          <h1 class="ml-3 text-xl font-bold" v-if="!sidebarCollapsed">AI理财助手</h1>
        </div>
        <button @click="toggleSidebar" class="p-2 rounded-full hover:bg-gray-100">
          <i class="fas" :class="sidebarCollapsed ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
        </button>
      </div>
      <nav class="sidebar-menu">
        <router-link 
          to="/dashboard" 
          class="sidebar-item flex items-center p-4 text-gray-700 hover:text-blue-500"
          active="isActive('dashboard') ? 'active' : ''"
        >
          <i class="fas fa-tachometer-alt w-6"></i>
          <span class="ml-3" v-if="!sidebarCollapsed">仪表盘</span>
        </router-link>
        <router-link 
          to="/transactions" 
          class="sidebar-item-item flex-item flex items-center p-4 text-gray-700 hover:text-blue-500"
          :class="isActive('transactionsactions') ? 'active' : ''"
        >
          <i class="fas fa-exchange-alt w-6"></i>
          <span class="ml-3" v-if="!sidebarCollapsed">智能记账</span>
        </router-link>
        <router-link 
          to="/budget" 
          class="sidebar-item flex items-center p-4 text-gray-700 hover:text-blue-500"
          :class="isActive('budget') ? 'active' : ''"
        >
          <i class="fas fa-piggy-bank w-6"></i>
          <span class="ml-3" v-if="!sidebarCollapsed">预算管理</span>
        </router-link>
        <router-link 
          to="/investments" 
          class="sidebar-item-item flex items-center p-4 text-gray-700 hover:text-blue-500"
          :class="isActive('investments') ? 'active' : ''"
        >
          <i class="fas fa-chart-line w-6"></i>
          <span class="ml-3" v-if="!sidebarCollapsed">投资分析</span>
        </router-link>
        <router-link 
          to="/reports" 
          class="sidebar-item flex items-center p-4 text-gray-700 hover:text-blue-500"
          :class="isActive('reports') ? 'active' : ''"
        >
          <i class="fas fa-file-alt w-6"></i>
          <span class="ml-3" v-if="!sidebarCollapsed">财务报告</span>
        </router-link>
        <router-link 
          to="/ai-assistant" 
          class="sidebar-item flex items-center p-4 text-gray-700 hover:text-blue-500"
          :class="isActive('ai-assistant') ? 'active' : ''"
        >
          <i class="fas fa-robot w-6"></i>
          <span class="ml-3" v-if="!sidebarCollapsed">AI助手</span>
        </router-link>
        <router-link 
          to="/settings" 
          class="sidebar-item flex items-center p-4 text-gray-700 hover:text-blue-500"
          :class="isActive('settings') ? 'active' : ''"
        >
          <i class="fas fa-cog w-6"></i>
          <span class="ml-3" v-if="!sidebarCollapsed">设置</span>
        </router-link>
      </nav>
    </aside>

    <!-- 主内容区域 -->
    <main class="flex-1 p-4 md:p-6 main-content" :style="sidebarCollapsed ? 'margin-left: 80px;' : 'margin-left: 250px;'">
      <header class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-2xl font-bold" v-text="pageTitle"></h2>
          <p class="text-gray-500" v-text="pageSubtitle"></p>
        </div>
        <div class="flex items-center">
          <div class="relative mr-4">
            <input type="text" placeholder="搜索..." class="input-field pl-10">
            <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
          </div>
          <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center">
            <i class="fas fa-user text-gray-600"></i>
          </div>
        </div>
      </header>

      <!-- 路由视图 -->
      <router-view />
    </main>
  </div>

  <!-- 仪表盘页面 -->
  <template id="dashboard-page">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
      <!-- 总收入卡片 -->
      <div class="card p-6">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-gray-500 text-sm">总收入</p>
            <h3 class="text-2xl font-bold mt-1">¥12,580</h3>
            <p class="text-green-500 text-sm mt-2 flex items-center">
              <i class="fas fa-arrow-up mr-1"></i> 12.5% <span class="text-gray-500 ml-1">较上月</span>
            </p>
          </div>
          <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center">
            <i class="fas fa-arrow-down text-green-500"></i>
          </div>
        </div>
      </div>
      
      <!-- 总支出卡片 -->
      <div class="card p-6">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-gray-500 text-sm">总支出</p>
            <h3 class="text-2xl font-bold mt-1">¥8,340</h3>
            <p class="text-red-500 text-sm mt-2 flex items-center">
              <i class="fas fa-arrow-up mr-1"></i> 8.2% <span class="text-gray-500 ml-1">较上月</span>
            </p>
          </div>
          <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center">
            <i class="fas fa-arrow-up text-red-500"></i>
          </div>
        </div>
      </div>
      
      <!-- 结余卡片 -->
      <div class="card p-6">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-gray-500 text-sm">本月结余</p>
            <h3 class="text-2xl font-bold mt-1">¥4,240</h3>
            <p class="text-green-500 text-sm mt-2 flex items-center">
              <i class="fas fa-arrow-up mr-1"></i> 25.3% <span class="text-gray-500 ml-1">较上月</span>
            </p>
          </div>
          <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center">
            <i class="fas fa-wallet text-blue-500"></i>
          </div>
        </div>
      </div>
      
      <!-- 预算使用卡片 -->
      <div class="card p-6">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-gray-500 text-sm">预算使用</p>
            <h3 class="text-2xl font-bold mt-1">68%</h3>
            <p class="text-yellow-500 text-sm mt-2 flex items-center">
              <i class="fas fa-exclamation-circle mr-1"></i> <span class="text-gray-500 ml-1">还有10天</span>
            </p>
          </div>
          <div class="w-12 h-12 rounded-full bg-yellow-100 flex items-center justify-center">
            <i class="fas fa-chart-pie text-yellow-500"></i>
          </div>
        </div>
      </div>
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
      <!-- 收支趋势图表 -->
      <div class="card p-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-semibold">收支趋势</h3>
          <div class="flex space-x-2">
            <button class="btn btn-outline text-sm py-1 px-3">月</button>
            <button class="btn btn-primary text-sm py-1 px-3">季</button>
            <button class="btn btn-outline text-sm py-1 px-3">年</button>
          </div>
        </div>
        <div class="chart-container">
          <canvas id="incomeExpenseChart"></canvas>
        </div>
      </div>
      
      <!-- 支出分类图表 -->
      <div class="card p-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-semibold">支出分类</h3>
          <button class="text-blue-500 text-sm">查看详情</button>
        </div>
        <div class="chart-container">
          <canvas id="expenseCategoryChart"></canvas>
        </div>
      </div>
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- 最近交易 -->
      <div class="card p-6 lg:col-span-2">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-semibold">最近交易</h3>
          <router-link to="/transactions" class="text-blue-500 text-sm">查看全部</router-link>
        </div>
        <div class="overflow-x-auto">
          <table class="min-w-full">
            <thead>
              <tr class="border-b">
                <th class="text-left py-3 px-4 text-sm font-medium text-gray-500">日期</th>
                <th class="text-left py-3 px-4 text-sm font-medium text-gray-500">描述</th>
                <th class="text-left py-3 px-4 text-sm font-medium text-gray-500">分类</th>
                <th class="text-right py-3 px-4 text-sm font-medium text-gray-500">金额</th>
              </tr>
            </thead>
            <tbody>
              <tr class="border-b hover:bg-gray-50">
                <td class="py-3 px-4 text-sm">2023-06-15</td>
                <td class="py-3 px-4">
                  <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center mr-3">
                      <i class="fas fa-shopping-bag text-blue-500"></i>
                    </div>
                    <span>超市购物</span>
                  </div>
                </td>
                <td class="py-3 px-4 text-sm"><span class="badge badge-info">日常消费</span></td>
                <td class="py-3 px-4 text-sm text-right text-red-500">-¥358</td>
              </tr>
              <tr class="border-b hover:bg-gray-50">
                <td class="py-3 px-4 text-sm">2023-06-14</td>
                <td class="py-3 px-4">
                  <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center mr-3">
                      <i class="fas fa-salary text-green-500"></i>
                    </div>
                    <span>工资收入</span>
                  </div>
                </td>
                <td class="py-3 px-4 text-sm"><span class="badge badge-success">工资</span></td>
                <td class="py-3 px-4 text-sm text-right text-green-500">+¥10,000</td>
              </tr>
              <tr class="border-b hover:bg-gray-50">
                <td class="py-3 px-4 text-sm">2023-06-12</td>
                <td class="py-3 px-4">
                  <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-yellow-100 flex items-center justify-center mr-3">
                      <i class="fas fa-utensils text-yellow-500"></i>
                    </div>
                    <span>餐厅用餐</span>
                  </div>
                </td>
                <td class="py-3 px-4 text-sm"><span class="badge badge-warning">餐饮</span></td>
                <td class="py-3 px-4 text-sm text-right text-red-500">-¥245</td>
              </tr>
              <tr class="border-b hover:bg-gray-50">
                <td class="py-3 px-4 text-sm">2023-06-10</td>
                <td class="py-3 px-4">
                  <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-purple-100 flex items-center justify-center mr-3">
                      <i class="fas fa-car text-purple-500"></i>
                    </div>
                    <span>加油</span>
                  </div>
                </td>
                <td class="py-3 px-4 text-sm"><span class="badge badge-info">交通</span></td>
                <td class="py-3 px-4 text-sm text-right text-red-500">-¥300</td>
              </tr>
              <tr class="hover:bg-gray-50">
                <td class="py-3 px-4 text-sm">2023-06-08</td>
                <td class="py-3 px-4">
                  <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center mr-3">
                      <i class="fas fa-home text-blue-500"></i>
                    </div>
                    <span>房租</span>
                  </div>
                </td>
                <td class="py-3 px-4 text-sm"><span class="badge badge-danger">住房</span></td>
                <td class="py-3 px-4 text-sm text-right text-red-500">-¥3,500</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      
      <!-- AI智能建议 -->
      <div class="card p-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-semibold">AI智能建议</h3>
          <span class="badge badge-primary">今日</span>
        </div>
        <div class="space-y-4">
          <div class="p-4 bg-blue-50 rounded-lg border border-blue-100">
            <div class="flex items-start">
              <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center mr-3 flex-shrink-0">
                <i class="fas fa-lightbulb text-blue-500"></i>
              </div>
              <div>
                <h4 class="font-medium">餐饮支出偏高</h4>
                <p class="text-sm text-gray-600 mt-1">您本月餐饮支出已超过预算20%，建议适当减少外卖和餐厅用餐。</p>
                <button class="text-blue-500 text-sm mt-2 flex items-center">
                  查看详情 <i class="fas fa-chevron-right ml-1 text-xs"></i>
                </button>
              </div>
            </div>
          </div>
          
          <div class="p-4 bg-green-50 rounded-lg border border-green-100">
            <div class="flex items-start">
              <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center mr-3 flex-shrink-0">
                <i class="fas fa-chart-line text-green-500"></i>
              </div>
              <div>
                <h4 class="font-medium">投资机会</h4>
                <p class="text-sm text-gray-600 mt-1">基于您的风险偏好，推荐考虑指数基金定投，平均年化收益率可达8-12%。</p>
                <button class="text-green-500 text-sm mt-2 flex items-center">
                  查看详情 <i class="fas fa-chevron-right ml-1 text-xs"></i>
                </button>
              </div>
            </div>
          </div>
          
          <div class="p-4 bg-yellow-50 rounded-lg border border-yellow-100">
            <div class="flex items-start">
              <div class="w-10 h-10 rounded-full bg-yellow-100 flex items-center justify-center mr-3 flex-shrink-0">
                <i class="fas fa-exclamation-triangle text-yellow-500"></i>
              </div>
              <div>
                <h4 class="font-medium">预算预警</h4>
                <p class="text-sm text-gray-600 mt-1">娱乐预算将在7天内用完，建议控制接下来的娱乐支出。</p>
                <button class="text-yellow-500 text-sm mt-2 flex items-center">
                  调整预算 <i class="fas fa-chevron-right ml-1 text-xs"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
        <router-link to="/ai-assistant" class="block text-center py-3 mt-4 text-blue-500 border border-blue-200 rounded-lg hover:bg-blue-50">
          查看更多AI建议
        </router-link>
      </div>
    </div>
  </template>

  <!-- 智能记账页面 -->
  <template id="transactions-page">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6">
      <div>
        <h2 class="text-xl font-bold">智能记账</h2>
        <p class="text-gray-500">记录和管理您的所有收支交易</p>
      </div>
      <div class="mt-4 md:mt-0 flex space-x-3">
        <button class="btn btn-outline">
          <i class="fas fa-filter mr-2"></i> 筛选
        </button>
        <button class="btn btn-primary" @click="showAddTransactionModal = true">
          <i class="fas fa-plus mr-2"></i> 添加交易
        </button>
      </div>
    </div>
    
    <!-- 交易统计卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
      <div class="card p-6">
        <p class="text-gray-500 text-sm">本月收入</p>
        <h3 class="text-2xl font-bold mt-1 text-green-500">¥12,580</h3>
        <div class="mt-4">

    });

    // 定义路由
    const routes = [
      { path: '/', redirect: '/dashboard' },
      { path: '/dashboard', component: { template: '#dashboard-page' } },
      { path: '/transactions', component: { template: '#transactions-page' } },
      { path: '/budget', component: { template: '#budget-page' } },
      { path: '/investments', component: { template: '#investments-page' } },
      { path: '/reports', component: { template: '#reports-page' } },
      { path: '/ai-assistant', component: { template: '#ai-assistant-page' } },
      { path: '/settings', component: { template: '#settings-page' } }
    ];

    // 创建路由实例
    const router = VueRouter.createRouter({
      history: VueRouter.createWebHashHistory(),
      routes
    });

    // 使用路由
    app.use(router);

    // 挂载应用
    app.mount('#app');
  </script>
</body>
</html>
